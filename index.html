    <script>
      (function() {
        try {
          var mode = localStorage.getItem('cb_ui_mode') || 'light';
          var root = document.documentElement;
          if (mode === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
          var boardTheme = localStorage.getItem('cb_board_theme') || 'ocean-slate';
          root.setAttribute('data-board-theme', boardTheme);
        } catch (e) {}
      })();
    </script>
